<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Euphoria Logo" class="logo">
        
        <nav>
            <ul>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Women</a></li>
                <li><a href="#">Combos</a></li>
                <li><a href="#">Joggers</a></li>
            </ul>
        </nav>
        
        <div class="search-bar">
            <img src="images/home_page_icons/search_icon.svg" alt="Search" class="icon">
            <input type="text" placeholder="Search">
        </div>
        
        <div class="icon-group">
            <div class="icon-square">
                <img src="images/home_page_icons/user_icon.svg" alt="Account" class="icon">
            </div>
            <div class="icon-square">
                <img src="images/home_page_icons/heart_icon.svg" alt="Wishlist" class="icon">
            </div>
            <div class="icon-square">
                <img src="images/home_page_icons/cart_icon.svg" alt="Cart" class="icon">
            </div>
        </div>
        
        <div class="burger-menu">
            <img src="" alt="Burger_menu" class="icon">
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>T-Shirt / Tops</h1>
                <h2>Summer Value Pack</h2>
                <p>cool / colorful / comfy</p>
                <button class="shop-btn">Shop Now</button>
            </div>
            
            <div class="hero-slider">
                <button class="slider-arrow slider-prev">
                    <img src="images/home_page_icons/carousel-control-prev.svg" alt="Previous">
                </button>
                
                <div class="hero-images">
                    <div class="hero-image active" style="background-image: url('images/home_page_person1.jpg')"></div>
                    <div class="hero-image" style="background-image: url('images/')"></div>
                    <div class="hero-image" style="background-image: url('images/')"></div>
                </div>
                
                <button class="slider-arrow slider-next">
                    <img src="images/home_page_icons/carousel-control-next.svg" alt="Next">
                </button>
                <div class="slider-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </section>
        
    </main>
    <footer>

    </footer>
</body>
</html>
