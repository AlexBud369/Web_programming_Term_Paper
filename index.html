<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <title>Home page</title>
</head>
<body>
<header>
    <div class="header-container">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Euphoria Logo">
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="about.html">About Us</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li class="auth-only"><a href="account.html" class="account-link">Account</a></li>
                <li class="auth-only"><a href="cart.html" class="cart-link">Cart</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <button class="search-btn">
                <img src="images/home_page_icons/search_icon.svg" alt="Search" class="icon">
            </button>
            <input type="text" placeholder="Search">
            
        </div>
        <div class="header-controls">
            <div class="language-selector">
                <span class="current-language">
                    English
                    <img src="images/home_page_icons/Vector.svg" alt="Select language" class="drop-icon">
                </span>
                <ul class="language-dropdown">
                    <li data-lang="en">English</li>
                    <li data-lang="ru">Русский</li>
                </ul>
            </div>
            <label class="custom-toggle">
                <input type="checkbox" class="toggle-input">
                <div class="toggle-track">
                  <div class="toggle-knob"></div>
                </div>
            </label>
            <button class="burger-menu" aria-label="Menu">
                <img src="images/home_page_icons/burger-menu-icon.svg" alt="" class="burger-menu-icon">
            </button>
        </div>
    </div>
    <div class="mobile-menu">
        <div class="auth-section">
            <button class="login-btn">Login</button>
            <button class="register-btn">Register</button>
            <div class="user-profile" style="display:none;">
                <span class="username"></span>
                <button class="logout-btn">Logout</button>
            </div>
        </div>
            
        <div class="accessibility-menu">
            <h3>Accessibility</h3>
            <div class="accessibility-option">
                <label>
                    <input type="checkbox" id="a11y-toggle"> Accessibility Mode
                </label>
            </div>
                
            <div class="a11y-options" style="display:none;">
                <div class="option-group">
                    <label>Text Size:</label>
                    <input type="range" id="font-size" min="100" max="200" step="50" value="100">
                    <span id="font-size-value">100%</span>
                </div>
                    
                <div class="option-group">
                    <label>Color Scheme:</label>
                    <div class="color-schemes">
                        <label><input type="radio" name="color-scheme" value="scheme-1"> Black+Green</label>
                        <label><input type="radio" name="color-scheme" value="scheme-2"> Beige+Brown</label>
                        <label><input type="radio" name="color-scheme" value="scheme-3"> Blue+Navy</label>
                    </div>
                </div>
                    
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="images-toggle"> Show Images
                    </label>
                </div>
            </div>
        </div>
    </div>
</header>
    <main>
       <section class="hero">
            <div class="hero-content">
                <h1>T-Shirt / Tops</h1>
                <h2>Summer Value Pack</h2>
                <p>cool / colorful / comfy</p>
                <button class="shop-btn">Shop Now</button>
            </div>
            
            <div class="hero-slider">
                <button class="slider-arrow slider-prev">
                    <img src="images/home_page_icons/carousel-control-prev.svg" alt="Previous">
                </button>
                
                <div class="hero-images">
                    <div class="hero-image active" style="background-image: url('images/home_page_person1.jpg')"></div>
                    <div class="hero-image" style="background-image: url('images/')"></div>
                    <div class="hero-image" style="background-image: url('images/')"></div>
                </div>
                
                <button class="slider-arrow slider-next">
                    <img src="images/home_page_icons/carousel-control-next.svg" alt="Next">
                </button>
                <div class="slider-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </section>
        
    </main>
    <footer>

    </footer>
</body>
</html>
