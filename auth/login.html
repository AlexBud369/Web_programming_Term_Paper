<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Euphoria</title>
    <link rel="preload" href="../fonts/CoreSansC-55Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/CoreSansC-65Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/CoreSansC-85Heavy.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/signin.css">
    <link rel="stylesheet" href="../css/layouts/footer.css">

</head>
<body class="body-container">
    

    <footer class="footer" aria-label="Site footer">
        <div class="footer__container">
            <div class="footer__column">
                <h2 class="footer__title">Shop</h2>
                <ul class="footer__list">
                    <li><a href="index.html" class="footer__link">Home</a></li>
                    <li><a href="catalog.html" class="footer__link">Catalog</a></li>
                    <li><a href="cart.html" class="footer__link auth-link">Cart</a></li>
                    <li><a href="account.html" class="footer__link auth-link">My Account</a></li>
                </ul>
            </div>
            <div class="footer__column">
                <h2 class="footer__title">Contacts</h2>
                <ul class="footer__list">
                    <li><a href="index.html#map" class="footer__link">Store Location</a></li>
                    <li><span class="footer__link">+1 (234) 567-89-00</span></li>
                    <li><a href="mailto:info@euphoria.com" class="footer__link">info@euphoria.com</a></li>
                </ul>
            </div>
            <section class="footer__subscribe" aria-label="Email subscription">
                <h2 class="footer__title">Newsletter</h2>
                <p class="footer__text">Subscribe for exclusive offers and updates</p>
                <form class="footer__form">
                    <div class="footer__form-group">
                        <input 
                            type="email" 
                            placeholder="Your email address" 
                            class="footer__input"
                            aria-label="Email for newsletter"
                            required
                        >
                        <button type="submit" class="footer__button">
                            <span>Subscribe</span>
                        </button>
                    </div>
                    <p class="footer__disclaimer">We respect your privacy. Unsubscribe at any time.</p>
                </form>
            </section>
        </div>
        <div class="footer__bottom">
            <div class="footer__social" aria-label="Social media links">
                <a href="#" aria-label="Facebook"><img src="../images/home_page_icons/facebook_icon.svg" alt="" class="footer__icon" width="24" height="24"></a>
                <a href="#" aria-label="Instagram"><img src="../images/home_page_icons/instagram_icon.svg" alt="" class="footer__icon" width="24" height="24"></a>
                <a href="#" aria-label="Twitter"><img src="../images/home_page_icons/twitter_icon.svg" alt="" class="footer__icon" width="24" height="24"></a>
            </div>
            <p class="footer__copyright">Copyright © 2023 Euphoria Folks Pvt Ltd. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
